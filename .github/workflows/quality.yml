name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No MongoDB, MinIO or network access: the suite doubles Mongo with mongomock,
      # S3 with moto, and parses HTML fixtures captured from the live site.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .
